<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Slicer</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/ui/favicon.png"/>
    <link href="style.css" rel="stylesheet" type="text/css"/>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="gameScreen" class="game-screen">
    <div class="game-card">
        <h1 id="cardTitle">FRUIT SLICER</h1>
        <p id="cardMessage">Slice the fruits and avoid the bombs</p>
        <p id="finalScore" class="final-score"></p>
        <button id="cardButton">START GAME</button>
    </div>
</div>
    <div class="scoreboard">
        <div>SCORE:<span id="score">0</span></div>
    </div>
    <script src="main.js"></script>
</body>
</html>
